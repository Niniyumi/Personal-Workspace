spring:
  application:
    name: personal-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/work?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}

server:
  error:
    include-message: never
