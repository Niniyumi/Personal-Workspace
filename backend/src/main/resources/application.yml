spring:
  application:
    name: personal-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/work?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  ai:
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${AI_MODEL:qwen-plus}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
  course:
    storage-dir: ${COURSE_STORAGE_DIR:./data/course-audio}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
  speech:
    base-url: ${SPEECH_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${SPEECH_MODEL:qwen3-asr-flash}
    timeout-seconds: ${SPEECH_TIMEOUT_SECONDS:120}

server:
  error:
    include-message: never

logging:
  charset:
    # IDEA 控制台与日志文件统一使用 UTF-8，避免中文业务日志乱码。
    console: UTF-8
    file: UTF-8
  file:
    name: ${LOG_FILE:./logs/personal-agent.log}
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
